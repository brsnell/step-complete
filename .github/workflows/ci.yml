name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Keeps main's vcpkg caches warm. A pull request can only restore caches from its own branch
  # or from main, and GitHub evicts a cache after 7 days without use; an evicted OCCT build costs
  # every job 50 to 75 minutes. Twice a week, main restores them (a few minutes per job), or
  # rebuilds them there instead of on someone's pull request.
  schedule:
    - cron: "41 3 * * 1,4"

concurrency:
  group: ci-${{ github.ref }}
  # Only pull requests cancel an older run: a run on main may be building the shared cache, and
  # cancelling it would throw that build away.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Qt 6.8 LTS: the newest LTS whose supported platforms still include macOS 12,
  # the newest macOS that 2016-era Macs can run.
  QT_VERSION: "6.8.*"
  VCPKG_COMMIT: 80aae04504a834399456d74605204bfe514762bf
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite"
  SC_TEST_DATA_DIR: ${{ github.workspace }}/tests/data/downloads

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check formatting
        run: |
          find src tests -name '*.cpp' -o -name '*.h' | xargs clang-format-18 --dry-run --Werror

  # Naming conventions (.clang-tidy, CLAUDE.md). Fails on any violation.
  naming:
    name: Naming (clang-tidy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Qt, OCCT and clang-tidy (Ubuntu packages, as in README)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build qt6-base-dev libqt6opengl6-dev \
            libgl-dev libgtest-dev libtbb-dev libocct-data-exchange-dev libocct-visualization-dev \
            libocct-ocaf-dev libfontconfig-dev clang-tidy-18
      - name: Configure and build
        # Building generates the files clang-tidy needs (Version.h, Qt's .moc files).
        run: |
          cmake --preset dev -DSC_BUILD_TOOLS=ON
          cmake --build --preset dev
      - name: Check naming
        run: |
          cmake --build --preset dev --target tidy 2>&1 | tee tidy.log
          # A header's warnings repeat for every file that includes it: count each once.
          grep 'warning: invalid case style' tidy.log | sort -u > naming.txt || true
          count=$(wc -l < naming.txt)
          {
            echo "### Naming conventions (clang-tidy)"
            echo
            echo "$count names to change."
            echo
            echo '```'
            grep -oE 'invalid case style for [a-z ]+' naming.txt | sort | uniq -c | sort -rn || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported Linux baseline (glibc 2.35), so binaries run on older distros.
          - name: Linux x64
            os: ubuntu-22.04
            triplet: x64-linux-dynamic
            werror: "ON"
            render-tests: true
          - name: Windows x64
            os: windows-2022
            triplet: x64-windows
            werror: "ON"
          - name: macOS arm64
            os: macos-15
            triplet: arm64-osx-sc
            osx-arch: arm64
            werror: "ON"
          # 2016-era Macs are Intel; cross-compiled on the arm64 runner.
          - name: macOS x64
            os: macos-15
            triplet: x64-osx-sc
            osx-arch: x86_64
            werror: "ON"
            skip-tests: true

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build bison gperf autoconf autoconf-archive automake libtool \
            libgl1-mesa-dev libglu1-mesa-dev libx11-dev libxi-dev libxext-dev libxrandr-dev \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libegl1 \
            xvfb libgl1-mesa-dri

      - name: Install macOS packages
        if: runner.os == 'macOS'
        run: brew install ninja autoconf autoconf-archive automake libtool

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ./.github/actions/msvc-env

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      # Restore and save are separate steps so the (slow) OCCT build is cached
      # as soon as vcpkg finishes, even if compiling our code fails afterwards.
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ matrix.triplet }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/**') }}
          restore-keys: vcpkg-${{ matrix.triplet }}-

      - name: Create vcpkg cache directory
        shell: bash
        run: mkdir -p .vcpkg-cache

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}

      - name: Configure
        shell: bash
        run: |
          extra=()
          if [ -n "${{ matrix.osx-arch }}" ]; then
            extra+=("-DCMAKE_OSX_ARCHITECTURES=${{ matrix.osx-arch }}")
          fi
          cmake --preset vcpkg \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
            -DSC_WARNINGS_AS_ERRORS=${{ matrix.werror }} \
            -DSC_BUILD_TOOLS=ON \
            "${extra[@]}"

      - name: Save vcpkg binary cache
        if: ${{ always() && steps.vcpkg-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: .vcpkg-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Build
        run: cmake --build --preset vcpkg

      - name: Fetch real-world test models
        if: ${{ !matrix.skip-tests }}
        shell: bash
        run: tests/data/fetch.sh

      - name: Test (core)
        if: ${{ !matrix.skip-tests }}
        run: ctest --preset vcpkg -LE render --output-on-failure

      # What OCCT extracts from the NIST PMI models, for docs/pmi-coverage.md.
      - name: PMI coverage report
        if: ${{ !matrix.skip-tests }}
        shell: bash
        run: |
          ctest --preset vcpkg -R NistPmi -V | grep '\[PMI\]' | sed 's/^[0-9]*: //' | tee pmi-report.txt
          { echo "### PMI extracted (${{ matrix.name }})"; echo '```'; cat pmi-report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # Import timings on a synthetic 500-part assembly (docs/performance.md).
      - name: Import benchmark
        if: ${{ matrix.render-tests }}
        shell: bash
        run: |
          build/vcpkg/tools/sc_make_bench_model bench.stp 500 2 2>/dev/null >/dev/null
          size=$(du -m bench.stp | cut -f1)
          {
            echo "### Import benchmark (${{ matrix.name }}, $(nproc) cores, ${size} MB, 500 parts, 1000 instances)"
            echo '```'
            build/vcpkg/tools/sc_bench_import bench.stp bench-cache 2>/dev/null | grep -v '^\s*$' | tail -5
            build/vcpkg/tools/sc_bench_import bench.stp bench-cache 2>/dev/null | grep -E 'cache|memory'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          rm -rf bench.stp bench-cache

      - name: Test (render, Xvfb + Mesa llvmpipe)
        if: ${{ matrix.render-tests }}
        env:
          SC_RENDER_DUMP_DIR: ${{ github.workspace }}/snapshots
        run: |
          mkdir -p "$SC_RENDER_DUMP_DIR"
          xvfb-run -a -s "-screen 0 1600x1200x24" ctest --preset vcpkg -L render -E pmi_snapshots --output-on-failure

      # Run separately with full output: it documents what each NIST model shows.
      - name: PMI snapshots (Xvfb + Mesa llvmpipe)
        if: ${{ matrix.render-tests }}
        env:
          SC_RENDER_DUMP_DIR: ${{ github.workspace }}/snapshots
        run: |
          mkdir -p "$SC_RENDER_DUMP_DIR"
          xvfb-run -a -s "-screen 0 1600x1200x24" ctest --preset vcpkg -R pmi_snapshots -V
          ls -la "$SC_RENDER_DUMP_DIR" | grep nist_ || true

      # How the NIST PMI models look with this build's OCCT (for docs/pmi-coverage.md).
      - name: Upload PMI snapshots
        if: ${{ always() && matrix.render-tests }}
        uses: actions/upload-artifact@v7
        with:
          name: pmi-snapshots-${{ matrix.triplet }}
          path: snapshots/nist_*.png
          retention-days: 14
          if-no-files-found: ignore

      # Artifact storage is not reachable from every environment that reviews these
      # images, so they are also printed to the log (small JPEGs, base64, chunked lines;
      # decode by concatenating the chunks of each name in order).
      - name: Print PMI snapshots
        if: ${{ always() && matrix.render-tests }}
        shell: bash
        run: |
          for f in snapshots/nist_*.png; do
            [ -f "$f" ] || continue
            # The log drops lines over 64 KB: split each image into 30 KB chunks.
            name=$(basename "$f" .png)
            convert "$f" -resize 960x -quality 80 jpg:- | base64 -w 30000 | sed "s/^/SNAPSHOT $name /"
          done

      - name: Upload test frames on failure
        if: ${{ failure() && matrix.render-tests }}
        uses: actions/upload-artifact@v7
        with:
          name: render-frames-${{ matrix.triplet }}
          path: build/vcpkg/Testing/Temporary/
